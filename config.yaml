moon:
  mu: 4.9028e12              # m^3/s^2
  radius: 1737.4e3           # m (spherical Moon)
  omega: 2.6617e-6           # rad/s, about the body z-axis
g0: 9.80665
sites:
  start:  {lat: -85.5, lon: -87.1,  elev: 0.0}
  target: {lat: -78.9044, lon: -87.1, elev: 0.0}
engine:
  n_engines: 4               # continuously throttleable engines, no pulsing; one equivalent engine in the trajectory
  thrust_per_engine: 6672.0  # N, max per engine
  isp_vac: 310.0             # s
  min_throttle: 0.041667     # fraction of T_max = 1112 N / (4 x 6672 N): ONE engine at its 1112 N floor, others shut down
  mixture_ratio: 1.65        # O/F by mass; split of propellant into oxidizer and fuel (post-processing only)
vehicle:
  m_wet: 5000.0              # kg, scaling and starting value only; size mode finds the real wet mass
  m_dry: 1500.0              # kg, includes structure, sensors and all engines
mission:
  propellant_reserve_factor: 1.1   # loaded propellant = 1.1 x propellant used over the whole round trip
  mode: size                       # size (minimum wet mass) | maximise_margin (fixed m_wet, maximise final mass)
  divert_radius: 150.0       # m; default sizing case is uprange, back toward the launch site
  landing_tolerance: 10.0    # m from each selected landing point; tighter design target inside the 50 m requirement
  gate_alt_bounds: [150.0, 1000.0]  # m, PLACEHOLDER; optimizer must satisfy the terminal glide slope at the moving gate
  gate_over_target: true     # hop-1 gate directly above the target, so the trunk does not favour the divert site
sensor:
  fov_deg: [90.0, 90.0]      # full horizontal/vertical square FOV; fixed downward body mount
  max_range: 10000.0         # m slant range to each observed point; established assumed camera capability
  min_altitude: 10.0         # m, RELAXED PLACEHOLDER; not a camera specification
  descent_speed_bounds: [0.1, 50.0]  # m/s downward, TIGHTENED PLACEHOLDER; positive minimum prevents hover
  horizontal_speed_max: 50.0        # m/s, TIGHTENED PLACEHOLDER; assumed sensor operating limit
  pointing_rate_max_deg_s: 30.0     # RELAXED PLACEHOLDER; existing 10 deg/s vehicle limit still applies
  observation_time_min: 1.0        # s, RELAXED PLACEHOLDER for acquisition
  processing_delay: 0.1            # s, RELAXED PLACEHOLDER after acquisition, before divert
  edge_margin_deg: 5.0             # TIGHTENED PLACEHOLDER per edge: 90 x 90 hardware FOV, 80 x 80 usable
limits:
  h_rise: 50.0               # m, end of vertical rise, PLACEHOLDER
  min_altitude: 50.0         # m, PLACEHOLDER
  glide_slope_deg: 45.0      # min elevation angle seen from site, PLACEHOLDER
  tilt_rate_max_deg_s: 10.0  # PLACEHOLDER
  td_vert_speed_max: 1.5     # m/s, PLACEHOLDER
  td_horiz_speed_max: 0.5    # m/s, PLACEHOLDER
  td_tilt_max_deg: 20.0      # body-up vs surface normal at touchdown; thrust-axis proxy, PLACEHOLDER
  phase_duration_bounds: {rise: [1, 120], ascent: [1, 600], coast: [1, 2000],
                          braking: [1, 600], observation: [0.1, 300], terminal: [1, 300]}   # s, PLACEHOLDER
solver:
  nodes: {rise: 10, ascent: 30, coast: 20, braking: 30, observation: 12, terminal: 50}
  ipopt: {max_iter: 3000, tol: 1.0e-8}
star_tracker:
  enabled: false             # baseline runner stays unchanged; tracker CLIs enable explicitly
  n_trackers: 2
  mount_model: independent_top
  antipodal: false
  top_plane_fov_clearance_margin_deg: 0.0   # ideal top-plane proxy, not CAD clearance
  full_cone_fov_deg: 20.0
  sun_exclusion_deg: 23.5
  earth_exclusion_deg: 23.5
  bright_body_exclusion_reference: boresight_to_center
  moon_limb_margin_deg: 0.0
  moon_limb_reference: fov_edge
  tracking_body_rate_max_deg_s: 6.0
  enforce_body_rate: false    # user waiver: active attitude control assumed; rate is diagnostic only
  update_gap_max_s: 1.0
  acquisition_time_s: 0.0
  switching_delay_s: 0.0
  initial_estimate_age_s: 0.0
  required_phase_kinds: [ascent, coast]
  body_roll_policy: projected_downrange
  coast_attitude_policy: inertial_endpoint_slerp
  mount_search:
    elevation_bounds_deg: [[10.0, 90.0], [10.0, 90.0]]
    paired_azimuth_bounds_deg: [[0.0, 360.0], [0.0, 360.0]]
    initial_elevations_deg: [72.66012643997279, 54.935656370286914]
    initial_azimuths_deg: [0.0, 180.0]
    tilt_bounds_deg: [0.0, 90.0]
    azimuth_bounds_deg: [0.0, 360.0]
    coarse_step_deg: 10.0
  assumed_geometry:
    label: synthetic_launch_aligned_geometry_not_ephemeris
    earth_direction_I: [1.0, 0.0, 0.0]
    sun_direction_I: [0.05059294007671333, -0.9987193571841863, 0.0]
    directions_frozen_in: I
    surface_stay_s: 0.0
  analysis:
    sample_step_s: 0.05
    transition_time_tolerance_s: 0.001
